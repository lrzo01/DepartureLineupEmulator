name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact_name: departure-board-emulator-windows
            executable_path: departure-board-emulator-windows.zip

          - os: ubuntu-latest
            platform: linux
            artifact_name: departure-board-emulator-linux
            executable_path: departure-board-emulator-linux.zip

          - os: macos-latest
            platform: mac
            artifact_name: departure-board-emulator-mac
            executable_path: departure-board-emulator-mac.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libglx-mesa0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Install project dependencies
        run: uv sync --all-groups

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Create .env from secret
        shell: bash
        run: |
          echo "WORLDLINE_TIGER_API_KEY=${{ secrets.WORLDLINE_TIGER_API_KEY }}" > .env

      - name: Build
        run: >
          uv run pyinstaller
          --noconsole
          --noconfirm
          --name=departure-board-emulator
          --add-data="config.toml:."
          --add-data=".env:."
          --add-data="fonts:fonts"
          run.py

      - name: Zip Windows bundle
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/departure-board-emulator" `
            -DestinationPath "departure-board-emulator-windows.zip"

      - name: Zip Linux bundle
        if: matrix.platform == 'linux'
        run: |
          cd dist
          zip -r ../departure-board-emulator-linux.zip departure-board-emulator
          cd ..

      - name: Zip macOS bundle
        if: matrix.platform == 'mac'
        run: |
          cd dist
          zip -r ../departure-board-emulator-mac.zip departure-board-emulator.app
          cd ..

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.executable_path }}
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Group release files
        run: |
          mkdir release-dir

          mv artifacts/departure-board-emulator-windows/departure-board-emulator-windows.zip release-dir/
          mv artifacts/departure-board-emulator-linux/departure-board-emulator-linux.zip release-dir/
          mv artifacts/departure-board-emulator-mac/departure-board-emulator-mac.zip release-dir/

      - name: Show release files
        run: ls -lh release-dir

      - name: Generate release
        uses: softprops/action-gh-release@v2
        with:
          files: release-dir/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}